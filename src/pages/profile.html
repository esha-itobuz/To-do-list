<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="../styles/scss/profile.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <main class="profile-page">
      <div class="profile-container">
        <header class="profile-header">
          <h1>Profile</h1>
          <button id="back-to-todos">Back</button>
        </header>

        <section class="profile-content">
          <div class="profile-info">
            <div class="profile-photo-container">
              <img id="profile-photo" src="" alt="Profile photo" />
              <i id="profile-photo-fallback" class="fa-solid fa-user"></i>
            </div>

            <div class="profile-details">
              <label>Email</label>
              <span id="profile-email-display"></span>

              <label>Name</label>
              <input id="name-input" type="text" />
              <span id="profile-name-display"></span>
            </div>
          </div>

          <div class="upload-section">
            <label>Upload photo</label>
            <input id="photo-input" type="file" accept="image/*" />
          </div>

          <div class="profile-actions">
            <button id="save-profile">Save</button>
            <button id="cancel-profile">Cancel</button>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="../js/profile/profile.js"></script>
  </body>
</html>
