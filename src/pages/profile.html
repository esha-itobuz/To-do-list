<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="../styles/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-div">
      <div id="todo-container">
        <div
          id="header"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h1>Profile</h1>
          <div style="display: flex; gap: 12px; align-items: center">
            <button
              id="back-to-todos"
              style="
                padding: 8px 12px;
                border-radius: 8px;
                border: none;
                background: #6c757d;
                color: #fff;
                cursor: pointer;
              "
            >
              Back
            </button>
          </div>
        </div>

        <div id="profile-content" style="padding: 24px">
          <div
            class="profile-card"
            style="
              max-width: 600px;
              margin: 0 auto;
              background: #fff;
              padding: 20px;
              border-radius: 12px;
              box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            "
          >
            <div
              style="
                display: flex;
                gap: 20px;
                align-items: center;
                margin-bottom: 20px;
              "
            >
              <div
                style="
                  width: 96px;
                  height: 96px;
                  border-radius: 50%;
                  overflow: hidden;
                  background: #f1f1f1;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <img
                  id="profile-photo"
                  src=""
                  alt="profile photo"
                  style="
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: none;
                  "
                />
                <i
                  id="profile-photo-fallback"
                  class="fa-solid fa-user"
                  style="font-size: 36px; color: #9ca3af"
                ></i>
              </div>
              <div style="flex: 1">
                <div style="margin-bottom: 8px">
                  <label
                    style="display: block; font-weight: 600; margin-bottom: 6px"
                    >Email</label
                  >
                  <input
                    id="email-input"
                    type="email"
                    style="
                      width: 100%;
                      padding: 12px;
                      border-radius: 8px;
                      border: 2px solid #e9ecef;
                    "
                  />
                </div>
                <div
                  id="profile-email-wrapper"
                  style="margin-bottom: 12px; color: #444; font-weight: 600"
                >
                  <span id="profile-email-display"></span>
                </div>

                <div style="margin-bottom: 8px">
                  <label
                    style="display: block; font-weight: 600; margin-bottom: 6px"
                    >Name</label
                  >
                  <input
                    id="name-input"
                    type="text"
                    style="
                      width: 100%;
                      padding: 12px;
                      border-radius: 8px;
                      border: 2px solid #e9ecef;
                    "
                  />
                </div>
                <div
                  id="profile-name-wrapper"
                  style="margin-bottom: 12px; color: #444; font-weight: 600"
                >
                  <span id="profile-name-display"></span>
                </div>
              </div>
            </div>

            <div style="margin-bottom: 16px">
              <label
                style="display: block; font-weight: 600; margin-bottom: 8px"
                >Upload photo</label
              >
              <input id="photo-input" type="file" accept="image/*" />
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end">
              <button
                id="save-profile"
                style="
                  padding: 10px 18px;
                  border-radius: 8px;
                  border: none;
                  background: #28a745;
                  color: #fff;
                  cursor: pointer;
                  font-weight: 600;
                "
              >
                Save
              </button>
              <button
                id="cancel-profile"
                style="
                  padding: 10px 18px;
                  border-radius: 8px;
                  border: 2px solid #e9ecef;
                  background: transparent;
                  cursor: pointer;
                "
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/auth/profile.js"></script>
  </body>
</html>
