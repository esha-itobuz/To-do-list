<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email</title>
    <link rel="stylesheet" href="../styles/scss/auth.css" />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <form id="auth-container">
      <h2>Verify Email</h2>
      <div id="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <button type="submit" id="sendOtpBtn">Send OTP</button>

      <div id="otpSection" style="display: none; margin-top: 1rem">
        <label for="otp">Enter OTP</label>
        <input
          type="text"
          id="otp"
          name="otp"
          maxlength="6"
          class="otp-input"
          placeholder="6-digit OTP"
        />
        <button type="button" id="verifyOtpBtn">Verify OTP</button>
      </div>

      <div class="auth-link">
        <a href="login.html">Back to Login</a>
      </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="../js/auth/verifyEmail.js"></script>
  </body>
</html>
